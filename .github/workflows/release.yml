name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain and target
        run: rustup toolchain install 1.90.0 --profile minimal --target ${{ matrix.target }}
      - name: Install cross (linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --version 0.2.5 --locked
      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            cross build --locked --release --target "${{ matrix.target }}"
          else
            cargo build --locked --release --target "${{ matrix.target }}"
          fi
      - name: Package
        shell: bash
        run: |
          bin="snoot"
          ext=""
          if [[ "${{ matrix.os }}" == windows-latest ]]; then
            ext=".exe"
          fi
          stage="snoot-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${bin}${ext}" "$stage/"
          cp README.md LICENSE "$stage/"
          if [[ "${{ matrix.archive }}" == zip ]]; then
            7z a "${stage}.zip" "$stage"
            echo "ASSET=${stage}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${stage}.tar.gz" "$stage"
            echo "ASSET=${stage}.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Checksum archive
        shell: bash
        run: |
          python - <<'PYTHON'
          import hashlib, os
          from pathlib import Path
          artifact = Path(os.environ["ASSET"])
          artifact.with_name(artifact.name + ".sha256").write_text(
              hashlib.sha256(artifact.read_bytes()).hexdigest() + "  " + artifact.name + "\n"
          )
          PYTHON
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          generate_release_notes: true
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
