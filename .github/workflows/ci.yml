name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests and fixture corpus
        run: cargo test --locked
      - name: Scan snoot (fixtures are excluded by .snootignore)
        run: cargo run --locked -- scan . --fail-on high --format json --format sarif --format cbom --output target/snoot-reports
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - name: Validate SARIF and CycloneDX schemas
        if: runner.os == 'Linux'
        run: |
          python -m pip install jsonschema==4.23.0
          python scripts/validate_reports.py target/debug/snoot
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snoot-reports-${{ runner.os }}
          path: target/snoot-reports/
          if-no-files-found: error

  action-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the reusable action
        uses: ./
        with:
          path: tests/fixtures/code/js_negative.js
          fail-on: high
          sarif: snoot-action.sarif
          upload-sarif: 'false'
      - name: Check that the action wrote one SARIF document
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          report = json.loads(Path("snoot-action.sarif").read_text())
          assert report["version"] == "2.1.0"
          assert report["runs"][0]["results"] == []
          PYTHON
      - name: Upload the action report to code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: snoot-action.sarif
          category: snoot-action-smoke
