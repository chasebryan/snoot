name: snoot

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Self-scan (informational)
        # Fixtures intentionally contain classical crypto — do not fail the build.
        run: cargo run --quiet -- scan . --format json --quiet > snoot-self.json || true
      - name: Upload SARIF from fixtures (smoke)
        run: |
          cargo run --quiet -- scan tests/fixtures/positive --format sarif --output snoot.sarif || true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: snoot.sarif
          category: snoot
