name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests and fixture corpus
        run: cargo test --locked
      - name: Action adapter contracts
        shell: bash
        run: |
          binary="target/debug/snoot"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          python3 scripts/action/test_run.py "$binary"
      - name: Recall regression benchmark
        id: recall
        shell: bash
        run: |
          binary="target/debug/snoot"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          python3 scripts/benchmark_recall.py "$binary" --json-output target/snoot-reports/recall-benchmark.json
      - name: Scan snoot (fixtures are excluded by .snootignore)
        run: cargo run --locked -- scan . --fail-on high --format json --format sarif --format cbom --output target/snoot-reports
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - name: Validate SARIF and CycloneDX schemas
        if: runner.os == 'Linux'
        run: |
          python -m pip install jsonschema==4.23.0
          python scripts/validate_reports.py target/debug/snoot
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.recall.outcome != 'skipped' }}
        with:
          name: snoot-reports-${{ runner.os }}
          path: target/snoot-reports/
          if-no-files-found: error

  release-candidate:
    uses: ./.github/workflows/release.yml

  action-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gate findings after the built-in upload
        id: gate
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/code/python_positive.py
          fail-on: medium
          sarif: snoot-gate.sarif
          category: snoot-action-gate
          upload-sarif: ${{ runner.os == 'Linux' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      - name: Check gating and repository paths
        shell: bash
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          SCANNER_EXIT: ${{ steps.gate.outputs.exit-code }}
          FINDINGS: ${{ steps.gate.outputs.finding-count }}
          UPLOAD_EXPECTED: ${{ runner.os == 'Linux' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
          SARIF_ID: ${{ steps.gate.outputs.sarif-id }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          assert os.environ['OUTCOME'] == 'failure'
          assert os.environ['SCANNER_EXIT'] == '2'
          assert os.environ['FINDINGS'] == '4'
          if os.environ['UPLOAD_EXPECTED'] == 'true':
              assert os.environ['SARIF_ID'], 'Built-in upload must succeed before the gate'
          report = json.loads(Path('snoot-gate.sarif').read_text())
          result = report['runs'][0]['results'][0]
          assert result['locations'][0]['physicalLocation']['artifactLocation']['uri'] == 'tests/fixtures/code/python_positive.py'
          PYTHON
          snoot init tests/fixtures/code/python_positive.py --output snoot-action-baseline.json
      - name: Baseline suppresses the gate
        id: baseline
        uses: ./
        with:
          path: tests/fixtures/code/python_positive.py
          baseline: snoot-action-baseline.json
          sarif: snoot-baseline.sarif
          upload-sarif: 'false'
      - name: Exclusion suppresses the gate
        id: exclude
        uses: ./
        with:
          path: tests/fixtures/code/python_positive.py
          exclude: '*.py'
          sarif: snoot-exclude.sarif
          upload-sarif: 'false'
      - name: Invalid input cannot upload stale SARIF
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          path: missing-snoot-scan-path
          sarif: snoot-gate.sarif
          upload-sarif: 'true'
      - name: Verify completed and failed action outputs
        shell: bash
        env:
          BASELINE_EXIT: ${{ steps.baseline.outputs.exit-code }}
          BASELINE_COUNT: ${{ steps.baseline.outputs.finding-count }}
          EXCLUDE_EXIT: ${{ steps.exclude.outputs.exit-code }}
          EXCLUDE_COUNT: ${{ steps.exclude.outputs.finding-count }}
          INVALID_OUTCOME: ${{ steps.invalid.outcome }}
          INVALID_REPORT: ${{ steps.invalid.outputs.sarif }}
        run: |
          python3 - <<'PYTHON'
          import os
          assert os.environ['BASELINE_EXIT'] == '0'
          assert os.environ['BASELINE_COUNT'] == '0'
          assert os.environ['EXCLUDE_EXIT'] == '0'
          assert os.environ['EXCLUDE_COUNT'] == '0'
          assert os.environ['INVALID_OUTCOME'] == 'failure'
          assert os.environ['INVALID_REPORT'] == ''
          PYTHON
