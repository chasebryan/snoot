[package]
name = "snoot"
version = "0.1.0"
edition = "2021"
description = "Snoot out the crypto hiding in your codebase."
license = "AGPL-3.0-only"
repository = "https://github.com/chasebryan/snoot"
readme = "README.md"
keywords = ["cryptography", "pqc", "post-quantum", "security", "cbom"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "snoot"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
walkdir = "2"
colored = "2"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
base64 = "0.22"

[dev-dependencies]

[profile.release]
strip = true
lto = true
