[package]
name = "snoot"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Snoot out the crypto hiding in your codebase."
license = "AGPL-3.0-only"
repository = "https://github.com/chasebryan/snoot"
readme = "README.md"
keywords = ["cryptography", "pqc", "post-quantum", "security", "cbom"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "snoot"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
walkdir = "2"
colored = "2"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-java = "0.23.5"
base64 = "0.23.1"
toml = "1.1.6"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
glob = "0.3"

tempfile = "3"

[dev-dependencies]

[profile.release]
strip = true
lto = true
